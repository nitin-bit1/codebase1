services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps:/usr/share/nginx/html:ro
    depends_on:
      - hub-1
      - hub-2

  hub-1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379

  hub-2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379

  redis:
    image: redis:7-alpine
