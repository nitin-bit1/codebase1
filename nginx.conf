events {}
http {
  absolute_redirect off;

  upstream hub_replicas {
    server hub-1:8080;
    server hub-2:8080;
  }

  server {
    listen 8080;

    # /apps/th -> TH Container (Login-enabled bundle + proxy APIs)
    location /apps/th/api/ {
      proxy_pass http://hub_replicas;
      proxy_set_header Host $host;
    }
    location /apps/th/ {
      alias /usr/share/nginx/html/th/;
      index index.html;
      try_files $uri $uri/ /apps/th/index.html;
    }

    # /apps/ac -> AC Container (No login)
    location /apps/ac/ {
      alias /usr/share/nginx/html/ac/;
      index index.html;
      try_files $uri $uri/ /apps/ac/index.html;
    }

    # /apps/fl -> FL Container (No login)
    location /apps/fl/ {
      alias /usr/share/nginx/html/fl/;
      index index.html;
      try_files $uri $uri/ /apps/fl/index.html;
    }

    # / -> Hub Container (Stateless Bobbin Replicas)
    location / {
      proxy_pass http://hub_replicas;
      proxy_set_header Host $host;
    }
  }
}
